<div
  class="flex flex-col md:flex-row justify-center items-center min-h-screen p-8 gap-8 md:gap-16 max-w-screen-lg mx-auto"
>
  <!-- Formulario -->
  <div class="w-full max-w-md">
    <!-- Título -->
    <h1 class="text-2xl font-bold mb-2 text-black text-center font-tt">
      Bienvenido
    </h1>
    <p class="text-sm text-gray-600 mb-6 text-center italic">
      Hoy es tu día para emprender. Tú decides el rumbo. Inicia sesión para
      conectar con el ecosistema
    </p>

    <!-- Formulario -->
    <form [formGroup]="loginForm" class="space-y-4">
      <!-- Correo -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Correo electrónico
        </label>
        <mat-form-field appearance="outline" class="w-full custom-mat-field">
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="Introduce tu correo electrónico"
          />
          <mat-error *ngIf="email.invalid">
            {{ getEmailErrorMessage() }}
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Contraseña
        </label>
        <mat-form-field appearance="outline" class="w-full custom-mat-field">
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Introduce tu contraseña"
          />
          <button
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            type="button"
            [attr.aria-label]="'Ocultar contraseña'"
            [attr.aria-pressed]="hidePassword"
          >
            <mat-icon>{{
              hidePassword ? "visibility_off" : "visibility"
            }}</mat-icon>
          </button>
          <mat-error *ngIf="password.invalid">
            {{ getPasswordErrorMessage() }}
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Olvidaste tu contraseña -->
      <div class="flex justify-end">
        <a href="#" class="text-sm text-blue-500 hover:underline"
          >¿Olvidaste tu contraseña?</a
        >
      </div>

      <!-- Botón login -->
      <button
        mat-flat-button
        type="button"
        (click)="onLogin()"
        class="w-full custom-login-button"
      >
        Iniciar Sesión
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      ¿Todavía no tienes una cuenta?
      <a routerLink="/register" class="text-blue-500 hover:underline"
        >Regístrate</a
      >
    </p>
  </div>

  <!-- Imagen -->
  <div class="hidden md:flex w-full max-w-lg justify-center">
    <img
      src="./assets/img/fotoInicial.png"
      alt="Equipo de trabajo"
      class="w-4/5 h-auto rounded-xl shadow-lg object-cover"
    />
  </div>
</div>
