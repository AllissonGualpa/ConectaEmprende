<form
  [formGroup]="form"
  (ngSubmit)="crear()"
  class="w-full max-w-5xl bg-white rounded-xl shadow-md p-6 flex flex-col max-h-[80vh]"
>
  <!-- Título -->
  <h2 class="text-2xl font-bold text-[#ED6C1C] mb-4 text-center">
    {{ dialogData?.mode === 'edit' ? 'Editar evento' : 'Crear nuevo evento' }}
  </h2>

  <!-- Contenido scrollable -->
  <div class="flex-1 overflow-y-auto pr-1">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Columna izquierda -->
      <div class="md:col-span-1">
        <!-- Nombre -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">
            Nombre del evento
          </label>
          <input
            type="text"
            formControlName="nombre"
            placeholder="Ingrese el nombre del evento"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>

        <!-- Descripción -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">
            Descripción
          </label>
          <textarea
            formControlName="descripcion"
            rows="3"
            placeholder="Descripción breve del evento"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          ></textarea>
        </div>

        <!-- Fecha -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">
            Fecha
          </label>
          <input
            type="date"
            formControlName="fecha"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>

        <!-- Horas -->
        <div class="mb-4 grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">
              Hora inicio
            </label>
            <input
              type="time"
              formControlName="horaInicio"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">
              Hora fin
            </label>
            <input
              type="time"
              formControlName="horaFin"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
          </div>
        </div>

        <!-- Tipo -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">
            Tipo
          </label>
          <select
            formControlName="tipo"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          >
            <option value="PRESENCIAL">Presencial</option>
            <option value="VIRTUAL">Virtual</option>
          </select>
        </div>

        <!-- Activar evento (solo edición de evento inactivo) -->
        <div
          *ngIf="dialogData?.mode === 'edit' && dialogData?.event?.activo === false"
          class="mb-4"
        >
          <label class="flex items-center gap-2 text-sm text-gray-700">
            <input
              type="checkbox"
              formControlName="activarEvento"
              class="w-4 h-4 rounded border-gray-300 text-orange-500 focus:ring-orange-500"
            />
            <span>Activar evento</span>
          </label>
        </div>

        <!-- Link inscripción -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">
            Link de inscripción
          </label>
          <input
            type="url"
            formControlName="link"
            placeholder="Ingrese el link del evento"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>

        <!-- Dirección / lugar -->
        <div class="mb-4">
          <label class="block text-sm font-bold text-gray-700 mb-1">
            Dirección / Lugar
          </label>
          <input
            type="text"
            formControlName="direccion"
            placeholder="Ej: Auditorio X / Online"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>
      </div>

      <!-- Columna derecha: imagen -->
      <div class="md:col-span-1 flex items-start justify-center">
        <div class="w-full">

          

          <label class="block text-sm font-bold text-gray-700 mb-2">
            Imagen del evento (opcional)
          </label>
          <div
            class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center"
          >
            <input
              type="file"
              class="hidden"
              (change)="onFileSelected($event)"
              accept="image/*"
              #fileInput
            />
            <div *ngIf="!form.get('imagen')?.value" class="text-gray-500">
              <i class="fa-solid fa-cloud-arrow-up text-4xl mb-4"></i>
              <p class="mb-2">
                Arrastra tu archivo o haz clic para seleccionar
              </p>
              <p class="text-sm text-gray-400">
                PNG, JPG o GIF (recomendado 800x400px)
              </p>
              <button
                type="button"
                (click)="fileInput.click()"
                class="mt-4 bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg"
              >
                Elegir archivo
              </button>
            </div>

            <div *ngIf="form.get('imagen')?.value" class="text-green-600">
              <i class="fa-solid fa-check text-4xl mb-4"></i>
              <p>
                Archivo seleccionado:
                {{ form.get('imagen')?.value?.name || 'Archivo cargado' }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div> <!-- grid -->
  </div> <!-- scroll -->

  <!-- Footer acciones (igual estilo botones blog) -->
  <div class="mt-4 flex justify-end items-center gap-3 pt-4 border-t border-gray-200">
    <div *ngIf="error" class="text-red-600 text-sm mr-2">
      {{ error }}
    </div>

    <button
      type="button"
      (click)="cancelar()"
      class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-lg shadow flex items-center gap-2 transition-colors duration-200"
    >
      <i class="fa-solid fa-times"></i>
      Cancelar
    </button>

    <button
      type="submit"
      [disabled]="loading || form.invalid"
      [class]="
        loading || form.invalid
          ? 'bg-gray-400 text-white px-8 py-3 rounded-lg shadow flex items-center gap-2 cursor-not-allowed'
          : 'bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-lg shadow flex items-center gap-2 transition-colors duration-200'
      "
    >
      <i
        class="fa-solid"
        [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-plus'"
      ></i>
      {{ loading
        ? (dialogData?.mode === 'edit' ? 'Editando...' : 'Creando...')
        : (dialogData?.mode === 'edit' ? 'Editar evento' : 'Crear evento') }}
    </button>
  </div>
</form>
