<div class="flex min-h-screen bg-gray-50">
  

  <app-navbar-admin></app-navbar-admin>

  <main class="flex-1 p-8">
    <!-- Overlay de loading centrado sobre el contenido principal -->
  <div *ngIf="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white/70 backdrop-blur-sm">
    <svg class="animate-spin h-10 w-10 text-orange-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <span class="text-gray-500 text-sm">Cargando datos de edición...</span>
  </div>
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-[#ED6C1C]">
        {{ mode === 'create' ? 'Crear Nuevo Blog' : 'Editar Blog' }}
      </h1>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6 mb-6 max-h-[80vh] overflow-y-auto">
      <!-- puedes mostrar un loader cuando loading sea true -->
      <div *ngIf="loading">
        <p class="text-gray-600">Cargando blog...</p>
      </div>

      <div *ngIf="!loading">
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-700 mb-2">Título del blog</label>
          <input type="text" [(ngModel)]="blog.titulo" placeholder="Escribe el título aquí..."
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
        </div>

        <!-- Resumen -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-700 mb-2">Resumen</label>
          <textarea [(ngModel)]="blog.resumen" placeholder="Escribe el resumen aquí..." rows="3"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
        </div>

        <!-- Contenido Completo -->
        <div class="mb-6">
          <div id="quillEditor" class="quill-container"></div>
        </div>

        <!-- Estado: solo visible en modo edición -->
        <div class="mb-6" *ngIf="mode === 'edit'">
          <label class="block text-sm font-bold text-gray-700 mb-2">Estado</label>
          <select
            [(ngModel)]="blog.estado"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          >
            <option value="BORRADOR">Borrador</option>
            <option value="PUBLICADO">Publicado</option>
          </select>
        </div>

        <!-- Tags -->
        <div class="mb-6">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-bold text-gray-700">Tags</label>
            <button (click)="toggleFormularioTag()"
              class="text-orange-600 hover:text-orange-700 text-sm font-semibold flex items-center gap-1">
              <i class="fa-solid" [ngClass]="mostrarFormularioTag ? 'fa-minus' : 'fa-plus'"></i>
              {{ mostrarFormularioTag ? 'Cancelar' : 'Crear nuevo tag' }}
            </button>
          </div>

          <!-- Formulario para crear nuevo tag -->
          <div *ngIf="mostrarFormularioTag" class="bg-orange-50 border border-orange-200 rounded-lg p-4 mb-4">
            <h3 class="text-sm font-bold text-gray-700 mb-3">Crear nuevo tag</h3>
            <div class="flex gap-2">
              <input type="text" [(ngModel)]="nuevoTagNombre" placeholder="Nombre del nuevo tag..."
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
                (keyup.enter)="crearNuevoTag()" />
              <button (click)="crearNuevoTag()"
                class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition-colors duration-200">
                <i class="fa-solid fa-check"></i>
                Crear
              </button>
            </div>
          </div>

          <!-- Tags seleccionados -->
          <div class="flex flex-wrap gap-2 mb-3">
            <span *ngFor="let tag of blog.tags"
              class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-sm flex items-center">
              {{ tag.nombre }}
              <button (click)="removerTag(tag)"
                class="ml-2 text-orange-600 hover:text-orange-800 font-bold leading-none focus:outline-none">
                ×
              </button>
            </span>
          </div>


          <!-- Selector de tags existentes -->
          <div class="flex gap-2">
            <select [(ngModel)]="tagSeleccionado"
              class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 flex-1">
              <option value="">Seleccionar tag existente</option>
              <option *ngFor="let tag of tags" [value]="tag.nombre">
                {{tag.nombre}}
              </option>
            </select>
            <button (click)="agregarTag()"
              class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg flex items-center gap-2 transition-colors duration-200">
              <i class="fa-solid fa-plus"></i>
              Agregar
            </button>
          </div>
        </div>

        <!-- Imagen destacada -->
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-700 mb-2">Imagen destacada</label>
          <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center">
            <input type="file" (change)="onFileSelected($event)" #fileInput class="hidden" accept="image/*" />
            <!-- estado SIN imagen (ni archivo ni url) -->
            <div *ngIf="!blog.imagenDestacada && !blog.urlImagen" class="text-gray-500">
              <i class="fa-solid fa-cloud-arrow-up text-4xl mb-4"></i>
              <p class="mb-2">Drag your file(s) or browse</p>
              <p class="text-sm text-gray-400">Max 5 MB files are allowed</p>
              <button
                (click)="fileInput.click()"
                class="mt-4 bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-lg">
                Seleccionar archivo
              </button>
            </div>

            <!-- estado CON imagen (archivo nuevo o url existente) -->
            <div *ngIf="blog.imagenDestacada || blog.urlImagen" class="text-green-600">
              <i class="fa-solid fa-check text-4xl mb-4"></i>
              <p>
                Imagen cargada:
                {{ blog.imagenDestacada?.name || blog.urlImagen }}
              </p>
              <button (click)="removerImagen()" class="mt-2 text-red-600 hover:text-red-800">
                Remover imagen
              </button>
            </div>
          </div>
        </div>

        <!-- Botones al final -->
        <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
          <button
            (click)="cancelar()"
            class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-lg shadow flex items-center gap-2 transition-colors duration-200">
            <i class="fa-solid fa-times"></i>
            Cancelar
          </button>

          <button
            (click)="guardar()"
            [disabled]="publicando"
            [class]="publicando
              ? 'bg-gray-400 text-white px-8 py-3 rounded-lg shadow flex items-center gap-2 cursor-not-allowed'
              : 'bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-lg shadow flex items-center gap-2 transition-colors duration-200'">
            <i class="fa-solid" [ngClass]="publicando ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
            {{ publicando
              ? (mode === 'create' ? 'Publicando...' : 'Guardando...')
              : (mode === 'create' ? 'Publicar' : 'Guardar cambios') }}
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
