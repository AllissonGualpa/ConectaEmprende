<div class="flex min-h-screen bg-gray-50">
  <app-navbar-admin></app-navbar-admin>

  <!-- Contenido principal -->
  <main class="flex-1 p-8 overflow-y-auto">
    <h1 class="text-2xl font-bold mb-6">¡Bienvenido {{ user.name }}!</h1>

    <!-- Tarjetas de Estadísticas -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-6">
      <div class="bg-white p-6 rounded-xl shadow-md">
        <p class="text-gray-500">Usuarios Totales</p>
        <h2 class="text-3xl font-bold text-blue-600">{{ stats.totalUsers | number }}</h2>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-md">
        <p class="text-gray-500">Emprendimientos</p>
        <h2 class="text-3xl font-bold text-orange-600">{{ stats.emprendimientos | number }}</h2>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-md">
        <p class="text-gray-500">Visitas Totales</p>
        <h2 class="text-3xl font-bold text-green-600">{{ stats.totalVisits | number }}</h2>
      </div>
    </div>

    <!-- Placeholder gráfico -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h3 class="text-lg font-semibold mb-4">Crecimiento con el tiempo</h3>
      <div class="h-64 flex items-center justify-center text-gray-400 border-2 border-dashed rounded-lg">
        (Aquí irá el gráfico)
      </div>
    </div>
  </main>
</div>
