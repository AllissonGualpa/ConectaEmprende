<div class="flex min-h-screen bg-gray-50">
  <app-navbar-admin></app-navbar-admin>

  <main class="flex-1 p-8 overflow-y-auto">
    <!-- Header -->
    <div class="mb-6">
      <!-- Fila superior -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4">
        <!-- Buscador -->
        <div class="flex items-center w-full md:w-2/3">
          <div class="relative flex-1">
            <input type="text" placeholder="Buscar blogs por título o estado..." (input)="onSearch($event)"
              class="w-full pl-10 pr-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </div>
        </div>

        <!-- Botones -->
        <div class="flex gap-2 md:gap-3">
          <button (click)="loadBlogs()"
            class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 text-sm rounded-lg shadow flex items-center gap-2 transition-colors duration-200">
            Consultar
            <i class="fa-solid fa-rotate-right"></i>
          </button>

          <button (click)="crearBlog()"
            class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 text-sm rounded-lg shadow flex items-center gap-2 transition-colors duration-200">
            <i class="fa-solid fa-plus"></i>
            Crear Blog
          </button>
        </div>
      </div>

      <!-- Filtros -->
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <!-- Tag -->
        <div>
          <select [(ngModel)]="selectedTag" (change)="onFilterChange()"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="">Todos los tags</option>
            <option *ngFor="let tag of availableTags" [value]="tag.idTag">
              {{ tag.nombre }}
            </option>
          </select>
        </div>

        <!-- Estado -->
        <div>
          <select [(ngModel)]="selectedEstado" (change)="onFilterChange()"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="">Todos los estados</option>
            <option value="PUBLICADO">Publicado</option>
            <option value="BORRADOR">Borrador</option>
            <option value="ARCHIVADO">Archivado</option>
          </select>
        </div>

        <!-- Fecha Inicio -->
        <div>
          <input type="date" [(ngModel)]="fechaInicio" (change)="onFilterChange()"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
        </div>

        <!-- Fecha Fin -->
        <div>
          <input type="date" [(ngModel)]="fechaFin" (change)="onFilterChange()"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
        </div>

        <!-- Botón limpiar -->
        <div class="flex items-center justify-end">
          <button (click)="clearFilters()"
            class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-2 text-sm rounded-lg shadow flex items-center justify-center gap-2 transition-colors duration-200">
            <i class="fa-solid fa-eraser text-xs"></i>
            Limpiar
          </button>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Título</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Descripción</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Estado</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Tags</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Fecha</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-600">Acción</th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let blog of filteredBlogs" class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-3 text-sm text-gray-900">{{ blog.titulo }}</td>
              <td class="px-6 py-3 text-sm text-gray-600">{{ blog.descripcionCorta }}</td>
              <td class="px-6 py-3 text-sm">
                <span [class]="getEstadoClass(blog.estado)">
                  {{ blog.estado }}
                </span>
              </td>
              <td class="px-6 py-3 text-sm text-gray-600">
                <span *ngFor="let tag of blog.tags"
                  class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs mr-1">
                  {{ tag.nombre }}
                </span>
              </td>
              <td class="px-6 py-3 text-sm text-gray-600">
                {{ blog.fechaCreacion | date: 'short' }}
              </td>
              <td class="px-6 py-3">
                <div class="flex gap-2 justify-center">
                  <!-- Editar -->
                  <button (click)="editarBlog(blog)" class="text-purple-600 hover:text-purple-800 transition-colors p-1"
                    title="Editar">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                      stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round"
                        d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                  </button>

                  <!-- Archivar / Desarchivar -->
                  <button (click)="toggleArchive(blog)"
                          [title]="blog.estado === 'ARCHIVADO' ? 'Desarchivar' : 'Archivar'"
                          [ngClass]="blog.estado === 'ARCHIVADO' ? 'text-green-600 hover:text-green-800' : 'text-red-600 hover:text-red-800'"
                          class="transition-colors p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                         stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round"
                            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>

            <tr *ngIf="filteredBlogs.length === 0 && !loading">
              <td colspan="6" class="px-6 py-6 text-center text-gray-500 text-sm">
                No se encontraron blogs
              </td>
            </tr>

            <tr *ngIf="loading">
              <td colspan="6" class="px-6 py-6 text-center">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500"></i>
                <p class="mt-2 text-gray-600 text-sm">Cargando blogs...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
