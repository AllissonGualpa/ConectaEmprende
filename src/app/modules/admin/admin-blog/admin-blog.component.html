<div class="flex min-h-screen bg-gray-50">
  <app-navbar-admin></app-navbar-admin>

  <main class="flex-1 p-8 overflow-y-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <!-- Buscador y Filtros -->
      <div class="flex-1 max-w-4xl">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
          <!-- Buscador -->
          <div class="md:col-span-2">
            <div class="relative">
              <input type="text" placeholder="Buscar blogs por título o estado..." (input)="onSearch($event)"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
              </svg>
            </div>
          </div>

          <!-- Filtro por Tags -->
          <div>
            <select [(ngModel)]="selectedTag" (change)="onFilterChange()"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
              <option value="">Todos los tags</option>
              <option *ngFor="let tag of availableTags" [value]="tag.idTag">{{ tag.nombre }}</option>
            </select>
          </div>


          <!-- Filtro por Estado -->
          <div>
            <select [(ngModel)]="selectedEstado" (change)="onFilterChange()"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
              <option value="">Todos los estados</option>
              <option value="PUBLICADO">Publicado</option>
              <option value="BORRADOR">Borrador</option>
              <option value="ARCHIVADO">Archivado</option>
            </select>
          </div>
        </div>

        <!-- Filtros de Fecha -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Inicio</label>
            <input type="date" [(ngModel)]="fechaInicio" (change)="onFilterChange()"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Fin</label>
            <input type="date" [(ngModel)]="fechaFin" (change)="onFilterChange()"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500" />
          </div>
          <div class="flex items-end">
            <button (click)="clearFilters()"
              class="w-full bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg shadow flex items-center justify-center gap-2 transition-colors duration-200">
              <i class="fa-solid fa-eraser"></i>
              Limpiar Filtros
            </button>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex gap-3 ml-4">
        <button (click)="loadBlogs()"
          class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg shadow flex items-center gap-2 transition-colors duration-200">
          Consultar
          <i class="fa-solid fa-rotate-right"></i>
        </button>

        <button (click)="crearBlog()"
          class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg shadow flex items-center gap-2 transition-colors duration-200">
          <i class="fa-solid fa-plus"></i>
          Crear Blog
        </button>
      </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Título</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Descripción</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Estado</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Tags</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Fecha</th>
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600">Acción</th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let blog of filteredBlogs" class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 text-sm text-gray-900">{{ blog.titulo }}</td>
              <td class="px-6 py-4 text-sm text-gray-600">{{ blog.descripcionCorta }}</td>
              <td class="px-6 py-4 text-sm">
                <span [class]="getEstadoClass(blog.estado)">
                  {{ blog.estado }}
                </span>
              </td>
              <td class="px-6 py-4 text-sm text-gray-600">
                <span *ngFor="let tag of blog.tags"
                  class="bg-orange-100 text-orange-800 px-2 py-1 rounded-full text-xs mr-1">
                  {{ tag.nombre }}
                </span>
              </td>
              <td class="px-6 py-4 text-sm text-gray-600">
                {{ blog.fechaCreacion | date:'short' }}
              </td>
              <td class="px-6 py-4">
                <div class="flex gap-3">
                  <button (click)="editarBlog(blog)" class="text-purple-600 hover:text-purple-800 transition-colors"
                    title="Editar">
                    <i class="fa-solid fa-pen text-lg"></i>
                  </button>
                  <button (click)="eliminarBlog(blog)" class="text-red-600 hover:text-red-800 transition-colors"
                    title="Eliminar">
                    <i class="fa-solid fa-trash text-lg"></i>
                  </button>
                </div>
              </td>
            </tr>

            <!-- Sin resultados -->
            <tr *ngIf="filteredBlogs.length === 0 && !loading">
              <td colspan="6" class="px-6 py-8 text-center text-gray-500">No se encontraron blogs</td>
            </tr>

            <!-- Cargando -->
            <tr *ngIf="loading">
              <td colspan="6" class="px-6 py-8 text-center">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500"></i>
                <p class="mt-2 text-gray-600">Cargando blogs...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
