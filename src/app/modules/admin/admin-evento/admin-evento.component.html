<div class="flex min-h-screen bg-white">
  <!-- Sidebar Navigation -->
  <aside class="w-64 bg-white shadow-lg fixed left-0 top-0 h-full">
    <app-navbar-admin></app-navbar-admin>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 ml-64">
    <div class="p-6">
      <!-- Header -->
      <div class="mb-6">
        <h1 class="text-2xl font-semibold text-gray-800">Eventos</h1>
      </div>

      <!-- Filtros -->
      <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
          <!-- Buscador -->
          <div class="md:col-span-1">
            <mat-form-field appearance="outline" class="w-full">
              <mat-icon matPrefix class="text-gray-400">search</mat-icon>
              <input matInput placeholder="Buscar..." [(ngModel)]="searchText" (ngModelChange)="applyFilters()">
            </mat-form-field>
          </div>

          <!-- Fecha Inicio -->
          <div class="md:col-span-1">
            <label class="block text-xs text-gray-600 mb-1">Fecha Inicio</label>
            <mat-form-field appearance="outline" class="w-full">
              <input matInput [matDatepicker]="pickerInicio" placeholder="30/07/2025" [(ngModel)]="fechaInicio" (dateChange)="applyFilters()" (ngModelChange)="applyFilters()">
              <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
              <mat-datepicker #pickerInicio></mat-datepicker>
            </mat-form-field>
          </div>

          <!-- Fecha Fin -->
          <div class="md:col-span-1">
            <label class="block text-xs text-gray-600 mb-1">Fecha Fin</label>
            <mat-form-field appearance="outline" class="w-full">
              <input matInput [matDatepicker]="pickerFin" placeholder="30/07/2025" [(ngModel)]="fechaFin" (dateChange)="applyFilters()" (ngModelChange)="applyFilters()">
              <mat-datepicker-toggle matSuffix [for]="pickerFin"></mat-datepicker-toggle>
              <mat-datepicker #pickerFin></mat-datepicker>
            </mat-form-field>
          </div>

          <!--estados-->
          <div class="md:col-span-1">
            <label class="block text-xs text-gray-600 mb-1">Estados</label>
                <mat-form-field appearance="outline" class="w-full">
                    <mat-select placeholder="Seleccionar estado" [(ngModel)]="estadoSeleccionado" (selectionChange)="applyFilters()">
                    <mat-option value="">Todos</mat-option>
                    <mat-option value="activo">Activo</mat-option>
                    <mat-option value="inactivo">Inactivo</mat-option>
                    </mat-select>
                </mat-form-field>
        </div>

          <!--boton-->
    <div class="flex gap-2 items-end">
      <button
        class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-md shadow-sm text-sm font-medium flex items-center gap-1 transition-colors duration-200">
        <i class="fa-solid fa-rotate-right"></i>
        Consultar
      </button>

      <button
        class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-md shadow-sm text-sm font-medium flex items-center gap-1 transition-colors duration-200"
        (click)="abrirCrearEvento()">
        <i class="fa-solid fa-plus"></i>
        Crear
      </button>
    </div>
        </div>
        <!-- Row below filters: Limpiar filtros -->
        <div class="flex justify-end mt-3">
          <button
            class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 rounded-md shadow-sm text-sm font-medium flex items-center gap-1 transition-colors duration-200"
            (click)="clearFilters()">
            <i class="fa-solid fa-ban"></i>
            Limpiar filtros
          </button>
        </div>
      </div>

      <!--tabla personalizada usando Tailwind (no CSS) -->
      <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="w-full table-auto">
          <thead>
            <tr>
              <th class="text-left px-6 py-3 font-bold text-gray-700">ID</th>
              <th class="text-left px-6 py-3 font-bold text-gray-700">Organizador</th>
              <th class="text-left px-6 py-3 font-bold text-gray-700">Nombre</th>
              <th class="text-left px-6 py-3 font-bold text-gray-700">Fecha</th>
              <th class="text-left px-6 py-3 font-bold text-gray-700">Hora</th>
              <th class="text-left px-6 py-3 font-bold text-gray-700">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let evento of pagedEventos; let i = index" [ngClass]="(i % 2 === 0) ? 'bg-[#f7f6fe]' : 'bg-white'" class="align-top hover:bg-[#f7f6fe]">
              <td class="px-6 py-4 text-gray-800 font-medium">{{ evento.id }}</td>
              <td class="px-6 py-4"><div class="flex items-center gap-2"><span class="text-gray-800">{{ evento.organizador }}</span></div></td>
              <td class="px-6 py-4 text-gray-800">{{ evento.nombre }}</td>
              <td class="px-6 py-4 text-gray-800">{{ evento.fecha }}</td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <span class="text-gray-800 font-medium">{{ evento.hora }}</span>
                  <span [class]="'px-3 py-1 rounded-full text-xs font-medium ' + getEstadoClass(evento.estado)">{{ evento.estado }}</span>
                </div>
              </td>
              <td class="px-6 py-4">
                <div class="flex gap-2">
                  <button mat-icon-button color="primary" (click)="editarEvento(evento)">
                    <mat-icon>edit</mat-icon>
                  </button>
                  <button mat-icon-button color="warn" (click)="eliminarEvento(evento)">
                    <mat-icon>delete</mat-icon>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Paginación -->
        <div class="flex justify-center items-center gap-2 p-4 border-t">
          <button mat-button (click)="prevPage()" [disabled]="pageIndex===0">Anterior</button>
          <ng-container *ngFor="let i of [].constructor(totalPages); let idx = index">
            <button mat-button [class.font-bold]="idx===pageIndex" (click)="goToPage(idx)">{{ idx + 1 }}</button>
          </ng-container>
          <button mat-button (click)="nextPage()" [disabled]="pageIndex >= totalPages -1">Siguiente</button>
        </div>
      </div>
    </div>
  </main>
</div>
