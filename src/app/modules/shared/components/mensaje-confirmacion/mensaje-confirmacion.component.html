<div
  class="dialog-container"
  [ngClass]="{
    'dialog-success': type === 'success',
    'dialog-error': type === 'error',
    'dialog-info': type === 'info',
    'dialog-warning': type === 'warning'
  }"
>
  <button class="close-button" (click)="close()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  </button>

  <div class="dialog-content">
    <div class="dialog-icon">
      <!-- Icono SUCCESS -->
      <svg
        *ngIf="type === 'success'"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="icon-svg icon-success"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>

      <!-- Icono ERROR -->
      <svg
        *ngIf="type === 'error'"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="icon-svg icon-error"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>

      <!-- Icono INFO -->
      <svg
        *ngIf="type === 'info'"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="icon-svg icon-info"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>

      <!-- Icono WARNING -->
      <svg
        *ngIf="type === 'warning'"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="icon-svg icon-warning"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
    </div>

    <div class="dialog-text">
      <h2 class="dialog-title">{{ title }}</h2>
      <p *ngIf="subtitle" class="dialog-subtitle">
        {{ subtitle }}
      </p>
    </div>
  </div>
</div>

<style>
  .dialog-container {
    position: relative;
    min-width: 380px;
    max-width: 500px;
    padding: 32px;
    box-sizing: border-box;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .close-button {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: #9ca3af;
    transition: color 0.2s;
    width: 24px;
    height: 24px;
  }

  .close-button:hover {
    color: #4b5563;
  }

  .close-button svg {
    width: 100%;
    height: 100%;
  }

  .dialog-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .dialog-icon {
    margin-bottom: 20px;
  }

  .icon-svg {
    width: 72px;
    height: 72px;
  }

  .icon-success {
    color: #10b981;
    stroke-width: 2;
  }

  .icon-error {
    color: #ef4444;
    stroke-width: 2;
  }

  .icon-info {
    color: #3b82f6;
    stroke-width: 2;
  }

  .icon-warning {
    color: #f59e0b;
    stroke-width: 2;
  }

  .dialog-text {
    width: 100%;
  }

  .dialog-title {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 700;
    color: #111827;
  }

  .dialog-subtitle {
    margin: 0;
    font-size: 15px;
    line-height: 1.6;
    color: #6b7280;
  }
</style>
