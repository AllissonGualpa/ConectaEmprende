<div
  class="dialog-container"
  [ngClass]="{
    'dialog-success': type === 'success',
    'dialog-error': type === 'error',
    'dialog-info': type === 'info'
  }"
>
  <div class="dialog-header">
    <div class="dialog-icon">
      <!-- Icono SUCCESS -->
      <svg
        *ngIf="type === 'success'"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="icon-svg"
      >
        <circle cx="12" cy="12" r="10" fill="#e6f6ec" />
        <path
          d="M9.5 12.8 7.3 10.6 6.2 11.7 9.5 15l8-8-1.1-1.1z"
          fill="#16a34a"
        />
      </svg>

      <!-- Icono ERROR -->
      <svg
        *ngIf="type === 'error'"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="icon-svg"
      >
        <circle cx="12" cy="12" r="10" fill="#fee2e2" />
        <path
          d="M15.5 8.5 12 12l3.5 3.5-1.5 1.5L10.5 13.5 7 17l-1.5-1.5L9 12 5.5 8.5 7 7l3.5 3.5L14 7z"
          fill="#dc2626"
        />
      </svg>

      <!-- Icono INFO (signo de exclamación) -->
      <svg
        *ngIf="type === 'info'"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="icon-svg"
      >
        <circle cx="12" cy="12" r="10" fill="#e0f2fe" />
        <path
          d="M11 10h2v6h-2v-6zm0-4h2v2h-2V6z"
          fill="#0369a1"
        />
      </svg>
    </div>

    <div class="dialog-text">
      <h2 class="dialog-title">{{ title }}</h2>
      <p *ngIf="subtitle" class="dialog-subtitle">
        {{ subtitle }}
      </p>
    </div>
  </div>

  <div class="dialog-actions">
    <button
      mat-button
      color="primary"
      (click)="close()"
    >
      Aceptar
    </button>
  </div>
</div>

<style>
  .dialog-container {
    min-width: 320px;
    max-width: 420px;
    padding: 16px 20px;
    box-sizing: border-box;
  }

  .dialog-success {
    /* tonos verdes suaves */
  }

  .dialog-error {
    /* tonos rojos suaves */
  }

  .dialog-info {
    /* tonos azules suaves */
  }

  .dialog-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .dialog-icon {
    flex-shrink: 0;
  }

  .icon-svg {
    width: 32px;
    height: 32px;
  }

  .dialog-title {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 600;
  }

  .dialog-subtitle {
    margin: 0;
    font-size: 14px;
    color: #4b5563;
  }

  .dialog-actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
  }
</style>
