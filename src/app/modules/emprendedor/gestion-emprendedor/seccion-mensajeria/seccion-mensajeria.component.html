<div class="relative">
  <div class="space-y-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Notificaciones</h2>
    <!--Filtros-->
    <div class="flex flex-col md:flex-row md:items-end md:gap-6 gap-4 mb-6">
      <div class="flex-1">
        <label class="block text-sm text-gray-600 mb-1 md:invisible">Buscar</label>
        <input type="text" placeholder="Buscar..." class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-200 w-full md:w-80" />
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <div>
          <label class="block text-sm text-gray-600 mb-1">Fecha Inicio</label>
          <input type="date" class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-200 w-full md:w-40" />
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">Fecha Fin</label>
          <input type="date" class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-200 w-full md:w-40" />
        </div>
      </div>
    </div>
    <div class="overflow-x-auto rounded-xl shadow">
      <table class="min-w-full bg-white text-left text-sm font-poppins">
        <thead>
          <tr class="border-b text-gray-700">
            <th class="px-4 py-3 font-semibold">ID</th>
            <th class="px-4 py-3 font-semibold">Propietario</th>
            <th class="px-4 py-3 font-semibold">Motivo</th>
            <th class="px-4 py-3 font-semibold">Fecha</th>
            <th class="px-4 py-3 font-semibold">Hora</th>
            <th class="px-4 py-3 font-semibold">Estado</th>
            <th class="px-4 py-3 font-semibold">Accion</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b hover:bg-gray-50" *ngFor="let noti of notificaciones">
            <td class="px-4 py-3">{{ noti.id }}</td>
            <td class="px-4 py-3">{{ noti.propietario }}</td>
            <td class="px-4 py-3">{{ noti.motivo }}</td>
            <td class="px-4 py-3">{{ noti.fecha }}</td>
            <td class="px-4 py-3">{{ noti.hora }}</td>
            <td class="px-4 py-3">
              <span class="px-3 py-1 rounded-full bg-green-100 text-green-700 font-semibold text-xs">{{ noti.estado }}</span>
            </td>
            <td class="px-4 py-3">
              <button class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2 rounded-lg shadow transition-all">ABRIR</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
