<div class="max-w-6xl mx-auto">
  <mat-card class="!shadow-lg !rounded-xl !border !border-gray-100">

    <mat-card-header class="!p-6 !pb-4 !flex !items-center !justify-between !gap-4">
      <mat-card-title class="!text-2xl !font-bold !text-gray-800 !m-0">
        Información Personal
      </mat-card-title>
      <button
        mat-raised-button
        class="!bg-orange-500 hover:!bg-orange-600 !text-white !font-semibold !px-6 !py-2 !rounded-lg !shadow-md hover:!shadow-lg transition-all duration-300 hover:scale-105"
        (click)="editarPerfil()">
        <mat-icon class="mr-2">edit</mat-icon>
        Editar Perfil
      </button>
    </mat-card-header>

    <mat-card-content class="!p-6 !pt-2">
      <div class="space-y-5">

        <!-- Nombre -->
        <div class="pb-5 border-b border-gray-200">
          <div class="text-sm font-semibold text-gray-600 mb-1">Nombre:</div>
          <div class="text-base text-gray-900">{{ informacionPersonal.nombre }}</div>
        </div>

        <!-- Email -->
        <div class="pb-5 border-b border-gray-200">
          <div class="text-sm font-semibold text-gray-600 mb-1">Email:</div>
          <div class="text-base text-gray-900">{{ informacionPersonal.email }}</div>
        </div>

        <!-- Fecha de Nacimiento -->
        <div class="pb-5 border-b border-gray-200">
          <div class="text-sm font-semibold text-gray-600 mb-1">Fecha de nacimiento:</div>
          <div class="text-base text-gray-900">{{ informacionPersonal.fechaNacimiento }}</div>
        </div>

        <!-- Fecha de Registro -->
        <div class="pb-5 border-b border-gray-200">
          <div class="text-sm font-semibold text-gray-600 mb-1">Fecha de registro:</div>
          <div class="text-base text-gray-900">{{ informacionPersonal.fechaRegistro }}</div>
        </div>

      </div>
    </mat-card-content>

  </mat-card>
</div>
