<div class="max-w-6xl mx-auto px-4 sm:px-6">

  <mat-card-header class="!p-4 sm:!p-6 !pb-4 !flex !flex-col sm:!flex-row !items-start sm:!items-center !justify-between !gap-3 sm:!gap-4">
    <mat-card-title class="!text-xl sm:!text-2xl !font-bold !text-gray-800 !m-0">
      Información Personal
    </mat-card-title>
    <button
      mat-raised-button
      class="w-full sm:w-auto !bg-orange-500 hover:!bg-orange-600 !text-white !font-semibold !px-4 sm:!px-6 !py-2 !rounded-lg !shadow-md hover:!shadow-lg transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2"
      (click)="editarPerfil()">
      <mat-icon>edit</mat-icon>
      <span>Editar perfil</span>
    </button>
  </mat-card-header>

  <mat-card-content class="!p-4 sm:!p-6 !pt-2">
    <div class="space-y-4 sm:space-y-5">

      <!-- Nombre -->
      <div class="pb-4 sm:pb-5 border-b border-gray-200">
        <div class="text-xs sm:text-sm font-semibold text-gray-600 mb-1">Nombre:</div>
        <div class="text-sm sm:text-base text-gray-900 break-words">{{ informacionPersonal.nombre }}</div>
      </div>

      <!-- Email -->
      <div class="pb-4 sm:pb-5 border-b border-gray-200">
        <div class="text-xs sm:text-sm font-semibold text-gray-600 mb-1">Email:</div>
        <div class="text-sm sm:text-base text-gray-900 break-all">{{ informacionPersonal.email }}</div>
      </div>

      <!-- Fecha de Nacimiento -->
      <div class="pb-4 sm:pb-5 border-b border-gray-200">
        <div class="text-xs sm:text-sm font-semibold text-gray-600 mb-1">Fecha de nacimiento:</div>
        <div class="text-sm sm:text-base text-gray-900">{{ informacionPersonal.fechaNacimiento }}</div>
      </div>

      <!-- Fecha de Registro -->
      <div class="pb-4 sm:pb-5 border-b border-gray-200">
        <div class="text-xs sm:text-sm font-semibold text-gray-600 mb-1">Fecha de registro:</div>
        <div class="text-sm sm:text-base text-gray-900">{{ informacionPersonal.fechaRegistro }}</div>
      </div>

    </div>
  </mat-card-content>

</div>

<!-- Modal editar perfil -->
<div
  *ngIf="showEditarPerfil"
  class="fixed inset-0 z-[9999] flex items-end sm:items-center justify-center bg-black/40 p-0 sm:p-4"
>
  <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-xl w-full sm:max-w-xl max-h-[90vh] overflow-y-auto p-5 sm:p-6 relative animate-slideUp sm:animate-none">
    <button
      type="button"
      class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors"
      (click)="onCancelarEdicion()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <h3 class="text-base sm:text-lg font-semibold text-gray-800 mb-4 pr-8">
      Editar perfil
    </h3>

    <app-editar-perfil
      [data]="formData"
      (save)="onGuardarPerfil($event)"
      (cancel)="onCancelarEdicion()"
    ></app-editar-perfil>
  </div>
</div>
