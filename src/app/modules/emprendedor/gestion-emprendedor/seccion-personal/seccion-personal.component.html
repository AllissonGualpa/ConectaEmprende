<div class="max-w-6xl mx-auto">

  <mat-card-header class="!p-6 !pb-4 !flex !items-center !justify-between !gap-4">
    <mat-card-title class="!text-2xl !font-bold !text-gray-800 !m-0">
      Información Personal
    </mat-card-title>
    <button
      mat-raised-button
      class="!bg-orange-500 hover:!bg-orange-600 !text-white !font-semibold !px-6 !py-2 !rounded-lg !shadow-md hover:!shadow-lg transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2"
      (click)="editarPerfil()">
      <mat-icon>edit</mat-icon>
      <span>Editar perfil</span>
    </button>
  </mat-card-header>

  <mat-card-content class="!p-6 !pt-2">
    <div class="space-y-5">

      <!-- Nombre -->
      <div class="pb-5 border-b border-gray-200">
        <div class="text-sm font-semibold text-gray-600 mb-1">Nombre:</div>
        <div class="text-base text-gray-900">{{ informacionPersonal.nombre }}</div>
      </div>

      <!-- Email -->
      <div class="pb-5 border-b border-gray-200">
        <div class="text-sm font-semibold text-gray-600 mb-1">Email:</div>
        <div class="text-base text-gray-900">{{ informacionPersonal.email }}</div>
      </div>

      <!-- Fecha de Nacimiento -->
      <div class="pb-5 border-b border-gray-200">
        <div class="text-sm font-semibold text-gray-600 mb-1">Fecha de nacimiento:</div>
        <div class="text-base text-gray-900">{{ informacionPersonal.fechaNacimiento }}</div>
      </div>

      <!-- Fecha de Registro -->
      <div class="pb-5 border-b border-gray-200">
        <div class="text-sm font-semibold text-gray-600 mb-1">Fecha de registro:</div>
        <div class="text-base text-gray-900">{{ informacionPersonal.fechaRegistro }}</div>
      </div>

    </div>
  </mat-card-content>

</div>

<!-- Modal editar perfil -->
<div
  *ngIf="showEditarPerfil"
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40"
>
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl mx-4 p-6 relative">
    <button
      type="button"
      class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"
      (click)="onCancelarEdicion()"
    >
      ×
    </button>

    <h3 class="text-lg font-semibold text-gray-800 mb-4">
      Editar perfil
    </h3>

    <app-editar-perfil
      [data]="formData"
      (save)="onGuardarPerfil($event)"
      (cancel)="onCancelarEdicion()"
    ></app-editar-perfil>
  </div>
</div>
