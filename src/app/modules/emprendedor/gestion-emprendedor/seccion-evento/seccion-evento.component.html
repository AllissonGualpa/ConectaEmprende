<!-- seccion-evento.component.html -->
<div class="max-w-7xl mx-auto px-4 mt-8">
    <h2 class="text-2xl font-bold mb-4">Gestión de eventos</h2>

    <div class="flex flex-col md:flex-row md:items-center gap-4 z-10">
        <app-search-bar class="flex-1" (search)="onSearch($event)" 
            [labelQuery]="'Buscar por nombre o tipo'" 
            [filters]="[
                { key: 'date', label: 'Fecha' },
                { key: 'type', label: 'Tipo', options: ['Online','Presencial'] }
            ]">
        </app-search-bar>

        <button (click)="abrirCrear()" 
            class="w-full md:w-auto bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded shadow">
            Crear Evento
        </button>
    </div>

    <!-- Cards section -->
    <section class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Placeholder cuando eventos === null -->
        <ng-container *ngIf="eventos === null; else whenLoaded">
            <div class="w-full flex items-center justify-center py-12">
                <div class="text-center">
                    <svg class="mx-auto w-20 h-20 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <rect x="3" y="5" width="18" height="16" rx="2" ry="2" stroke-width="1.5"></rect>
                      <path d="M16 3v4M8 3v4" stroke-width="1.5"></path>
                      <path d="M3 10h18" stroke-width="1.5"></path>
                    </svg>
                    <h3 class="mt-4 text-lg font-semibold text-gray-700">Cargando eventos...</h3>
                    <p class="mt-2 text-sm text-gray-500">Espere un momento mientras obtenemos los eventos.</p>
                </div>
            </div>
        </ng-container>

        <!-- Cuando ya se cargó (eventos es array) -->
        <ng-template #whenLoaded>
            <ng-container *ngIf="eventosCards && eventosCards.length > 0; else noEvents">
                <div class="space-y-6">
                    <app-card-event 
                        *ngFor="let evento of eventosPaginados"
                        [evento]="evento"
                        [showActions]="true"
                        (eliminar)="cancelarEvento($event)"
                        (editar)="editarEventoFromCard($event)">
                    </app-card-event>
                </div>

                <!-- Paginador -->
                <div class="mt-8 flex justify-center">
                    <mat-paginator 
                        [length]="totalItems"
                        [pageSize]="pageSize"
                        [pageIndex]="pageIndex"
                        [pageSizeOptions]="[5, 10, 25]"
                        (page)="onPageChange($event)"
                        showFirstLastButtons
                        class="bg-white rounded-lg shadow">
                    </mat-paginator>
                </div>
            </ng-container>
        </ng-template>

        <!-- Mensaje cuando se cargó y no hay eventos -->
        <ng-template #noEvents>
            <div class="w-full flex items-center justify-center py-12">
                <div class="text-center">
                    <svg class="mx-auto w-20 h-20 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <rect x="3" y="5" width="18" height="16" rx="2" ry="2" stroke-width="1.5"></rect>
                      <path d="M16 3v4M8 3v4" stroke-width="1.5"></path>
                      <path d="M3 10h18" stroke-width="1.5"></path>
                    </svg>
                    <h3 class="mt-4 text-lg font-semibold text-gray-700">No hay eventos disponibles</h3>
                    <p class="mt-2 text-sm text-gray-500">Vuelve pronto para descubrir nuevos eventos.</p>
                </div>
            </div>
        </ng-template>

    </section>
</div>
