
<div class="max-w-7xl mx-auto px-4 mt-8">
    <h2 class="text-2xl font-bold mb-4">Gestión de eventos</h2>

    <div class="flex items-center gap-4">
        <div class="flex-1">
            <app-search-bar (search)="onSearch($event)" [labelQuery]="'Buscar por nombre o tipo'" [filters]="[
                        { key: 'date', label: 'Fecha' },
                        { key: 'location', label: 'Ubicación', options: ['Quito','Guayaquil','Cuenca'] },
                        { key: 'type', label: 'Tipo', options: ['Online','Presencial'] }]">
            </app-search-bar>
        </div>
    </div>
</div>
