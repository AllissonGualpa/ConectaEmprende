<div class="max-w-7xl mx-auto px-4 mt-8">
    <h2 class="text-2xl font-bold mb-4">Gestión de eventos</h2>

    <div class="flex flex-col md:flex-row md:items-center gap-4 z-10">
        <app-search-bar class="flex-1" (search)="onSearch($event)" [labelQuery]="'Buscar por nombre o tipo'" [filters]="[
                    { key: 'date', label: 'Fecha' },
                    { key: 'type', label: 'Tipo', options: ['Online','Presencial'] }]">
        </app-search-bar>

        <button (click)="abrirCrear()" class="w-full md:w-auto bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded shadow">
            Crear Evento
        </button>
    </div>

        <!-- Cards section -->
        <section class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- badge template and action template similar to eventos.component.html -->
            <ng-template #eventBadge let-item>
                <div class="absolute top-3 right-3">
                    <div class="bg-blue-600 text-white px-3 py-1 rounded-xl text-sm shadow">
                        {{ item.date ? (item.date | date:'d MMM') : '02 Abr' }}
                    </div>
                </div>
            </ng-template>

            <ng-template #eventActions let-item>
                <div class="flex items-center gap-3">
                    <button (click)="eliminarEvento(item)" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">Inactivar Evento</button>
                    <button (click)="editarEvento(item)" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded">Editar Evento</button>
                </div>
            </ng-template>

            <ng-template #emptyOverlay></ng-template>

            <!-- Placeholder cuando eventos === null -->
            <ng-container *ngIf="eventos === null; else whenLoaded">
                <div class="w-full flex items-center justify-center py-12">
                    <div class="text-center">
                        <!-- icono calendario -->
                        <svg class="mx-auto w-20 h-20 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <rect x="3" y="5" width="18" height="16" rx="2" ry="2" stroke-width="1.5"></rect>
                          <path d="M16 3v4M8 3v4" stroke-width="1.5"></path>
                          <path d="M3 10h18" stroke-width="1.5"></path>
                        </svg>
                        <h3 class="mt-4 text-lg font-semibold text-gray-700">Cargando eventos...</h3>
                        <p class="mt-2 text-sm text-gray-500">Espere un momento mientras obtenemos los eventos.</p>
                    </div>
                </div>
            </ng-container>

            <!-- Cuando ya se cargó (eventos es array) -->
            <ng-template #whenLoaded>
                <ng-container *ngIf="eventos && eventos.length > 0; else noEvents">
                    <app-cards
                        [items]="eventos"
                        [pageSize]="3"
                        [singleColumn]="true"
                        [badgeTemplate]="eventBadge"
                        [actionTemplate]="eventActions"
                        [overlayTemplate]="emptyOverlay"
                        (discover)="onDiscover($event)"
                        (toggleFavorite)="onToggleFavorite($event)"
                        ctaLabel="Ver Detalle">
                    </app-cards>
                </ng-container>
            </ng-template>

            <!-- Mensaje cuando se cargó y no hay eventos -->
            <ng-template #noEvents>
                <div class="w-full flex items-center justify-center py-12">
                    <div class="text-center">
                        <svg class="mx-auto w-20 h-20 text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <rect x="3" y="5" width="18" height="16" rx="2" ry="2" stroke-width="1.5"></rect>
                          <path d="M16 3v4M8 3v4" stroke-width="1.5"></path>
                          <path d="M3 10h18" stroke-width="1.5"></path>
                        </svg>
                        <h3 class="mt-4 text-lg font-semibold text-gray-700">No hay eventos disponibles</h3>
                        <p class="mt-2 text-sm text-gray-500">Vuelve pronto para descubrir nuevos eventos.</p>
                    </div>
                </div>
            </ng-template>

        </section>
</div>
