<div class="space-y-6">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
      <input
        type="text"
        class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
        [(ngModel)]="data.nombre"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
      <input
        type="text"
        class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
        [(ngModel)]="data.apellido"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Género</label>
      <select
        class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white"
        [(ngModel)]="data.genero"
      >
        <option value="">Selecciona una opción</option>
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
      <input
        type="email"
        class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
        [(ngModel)]="data.correo"
      />
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de nacimiento</label>
    <input
      type="date"
      class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
      [ngModel]="fechaNacimientoDate"
      (ngModelChange)="onFechaNacimientoChange($event)"
    />
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
    <button
      type="button"
      class="px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-50"
      (click)="onCancel()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="px-5 py-2 rounded-lg bg-orange-500 text-white text-sm font-semibold hover:bg-orange-600"
      (click)="onSave()"
    >
      Guardar cambios
    </button>
  </div>
</div>
