<app-navbar></app-navbar>

<main>
  <section
    class="relative bg-center bg-cover bg-no-repeat"
    style="background-image: url('/assets/img/emprendimiento/foto1.png');"
    aria-label="Sección de bienvenida">

    <!--capa oscura-->
    <div class="absolute inset-0 bg-black/50"></div>

    <!--contenido-->
    <div
      class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 min-h-[420px] sm:min-h-[520px] md:min-h-[580px] lg:min-h-[620px] flex flex-col items-center justify-center text-center text-white py-12 sm:py-16">

      <!--titulo-->
      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold mb-3 sm:mb-4 font-poppins px-4">
        Emprendimientos
      </h1>

      <!--parrafo-->
      <p class="text-sm sm:text-base md:text-lg lg:text-xl text-white/90 font-medium max-w-xs sm:max-w-md md:max-w-2xl lg:max-w-3xl mx-auto leading-relaxed px-4 mt-2 sm:mt-4">
        Explora proyectos creativos y negocios locales que inspiran.
        <span class="hidden sm:inline"><br></span>
        <span class="sm:hidden"> </span>
        Descubre cómo los emprendedores están transformando ideas en realidades cercanas a ti.
      </p>

      <!-- search bar-->
      <div class="w-full flex justify-center mt-6 sm:mt-8 md:mt-10 px-4">
        <div class="w-full max-w-5xl">
          <app-search-bar
            (search)="onSearch($event)"
            [labelQuery]="'Buscar por nombre o tipo'"
            [filters]="[
              { key: 'category', label: 'Categoría', options: ['Arte y cultura', 'Salud y Bienestar', 'Tecnología','Moda','Alimentos y Bebidas','Medio Ambiente', 'Educación','Servicios Profesionales'] },
              { key: 'location', label: 'Ubicación', options: ['Quito','Guayaquil','Cuenca'] },
              { key: 'type', label: 'Tipo', options: ['Producto','Servicio'] }
            ]">
          </app-search-bar>
        </div>
      </div>

    </div>
  </section>
  
  <!-- tarjetas -->
  <section class="py-8 sm:py-10 md:py-12 lg:py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-cards
      [items]="filteredCards"
      [pageSize]="6"
      (discover)="onDiscover($event)"
      (toggleFavorite)="onToggleFavorite($event)">
    </app-cards>
  </section>
</main>

<app-footer></app-footer>
