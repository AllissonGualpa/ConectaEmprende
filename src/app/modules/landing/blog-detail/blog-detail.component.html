<app-navbar></app-navbar>

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <a
    (click)="volverAlBlog()"
    class="flex items-center text-gray-600 hover:text-gray-800 mb-6 text-sm group cursor-pointer"
  >
    <svg
      class="w-4 h-4 mr-2 group-hover:-translate-x-1 transition-transform"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 19l-7-7 7-7"
      />
    </svg>
    Volver al blog
  </a>

  <!-- LOADING -->
  <div *ngIf="cargando" class="flex flex-col items-center justify-center py-12">
    <svg class="animate-spin h-10 w-10 text-orange-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <span class="text-gray-500 text-sm">Cargando artículo...</span>
  </div>

  <!-- ERROR -->
  <div *ngIf="error" class="text-center text-red-500 py-10">
    {{ error }}
  </div>

  <!-- CONTENIDO -->
  <ng-container *ngIf="!cargando && articulo">

    <!-- Fecha -->
    <p class="text-sm text-gray-400 mb-3 text-center">
      Publicado el {{ articulo.fechaPublicacion }}
    </p>

    <!-- Título -->
    <h1
      class="text-3xl sm:text-4xl font-bold mb-4 font-poppins text-center"
      style="color: #ED6C1C;"
    >
      {{ articulo.titulo }}
    </h1>

    <!-- Descripción -->
    <p class="text-sm text-gray-400 mb-6 text-center max-w-3xl mx-auto">
      {{ articulo.descripcionCorta }}
    </p>

    <!-- Tags -->
    <div class="flex flex-wrap justify-center gap-2 mb-6">
      <span
        *ngFor="let tag of articulo.tags"
        class="text-xs font-medium px-3 py-1 rounded-full border"
        [style.borderColor]="'#C0A537'"
        [style.color]="'#C0A537'"
      >
        {{ tag.nombre }}
      </span>
    </div>

    <!-- Imagen -->
    <img
      [src]="articulo.urlImagen"
      [alt]="articulo.titulo"
      class="w-full h-72 object-cover rounded-lg shadow-md mb-8"
    />

    <!-- Contenido -->
    <div
      class="text-gray-700 text-base sm:text-lg leading-relaxed whitespace-pre-line prose max-w-none"
      [innerHTML]="contenidoSeguro"
    ></div>

  </ng-container>
</main>

<app-footer></app-footer>
