<app-navbar></app-navbar>

<main class="max-w-4xl mx-auto p-6">
	<button class="text-sm text-gray-600 mb-4" (click)="goBack()"> ← Volver a eventos</button>

	<section *ngIf="isLoading" class="text-center py-12">Cargando evento...</section>

	<section *ngIf="error && !isLoading" class="text-center text-red-600 py-12">{{ error }}</section>

	<article *ngIf="event && !isLoading" class="bg-white rounded shadow p-6">
		<img *ngIf="event.imagenUrl" [src]="event.imagenUrl" alt="{{ event.titulo }}" class="w-full h-64 object-cover rounded mb-4" />
		<h1 class="text-2xl font-bold mb-2">{{ event.titulo }}</h1>
		<div class="text-sm text-gray-600 mb-4">
			<span *ngIf="event.fechaEvento">📅 {{ event.fechaEvento | date:'longDate' }} </span>
			<span *ngIf="event.tipoEvento"> • {{ event.tipoEvento | titlecase }}</span>
			<span *ngIf="event.lugar"> • {{ event.lugar }}</span>
		</div>

		<p class="mb-4 text-gray-800" [innerText]="event.descripcion"></p>

		<dl class="grid grid-cols-1 gap-2 text-sm text-gray-700">
			<div *ngIf="event.direccion"><dt class="font-semibold">Dirección</dt><dd>{{ event.direccion }}</dd></div> 
			<div *ngIf="event.linkInscripcion"><dt class="font-semibold">Inscripción</dt><dd><a class="text-orange-500" target="_blank">Ir al formulario</a></dd></div> 
		</dl>
	</article>

</main>

<app-footer></app-footer>
