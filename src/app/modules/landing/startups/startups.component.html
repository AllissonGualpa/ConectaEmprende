<app-navbar></app-navbar>

<main>
  <!-- Sección de bienvenida -->
  <section
    class="relative bg-center bg-cover bg-no-repeat"
    style="background-image: url('/assets/img/emprendimiento/foto1.png');"
    aria-label="Sección de bienvenida"
  >
    <!--capa oscura-->
    <div class="absolute inset-0 bg-black/10"></div>

    <!--contenido-->
    <div class="relative max-w-7xl mx-auto px-4 sm:px-8 py-16 sm:py-20 md:py-24 min-h-fit md:min-h-[580px] flex flex-col items-start justify-center text-left text-white transition-all duration-300 ease-in-out">
      <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 font-poppins">
        Startups
      </h1>

      <!--parrafo-->
      <p
        class="text-base sm:text-lg md:text-xl text-white/90 font-medium leading-relaxed mt-2
               max-w-5xl lg:max-w-6xl"
      >
        Conoce startups innovadoras que están marcando tendencia. <br />
        Descubre propuestas escalables con potencial de impacto y crecimiento global.
      </p>

      <!-- search bar-->
      <div class="w-full mt-10 z-10">
        <div class="max-w-5xl lg:max-w-6xl">
          <app-search-bar
            *ngIf="searchFilters.length > 0"
            (search)="onSearch($event)"
            [labelQuery]="'Buscar por nombre'"
            [filters]="searchFilters"
          >
          </app-search-bar>
        </div>
      </div>
    </div>
  </section>

  <!-- tarjetas -->
  <section
    class="py-8 sm:py-10 md:py-12 lg:py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"
  >
    <!-- Indicador de carga -->
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-12">
      <svg class="animate-spin h-10 w-10 text-orange-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <span class="text-gray-500 text-sm">Cargando startups...</span>
    </div>

    <!-- Cards cuando no está cargando -->
    <ng-container *ngIf="!loading">
      <app-cards
        *ngIf="filteredCards.length > 0"
        [items]="filteredCards"
        [pageSize]="6"
        (discover)="onDiscover($event)"
        (toggleFavorite)="onToggleFavorite($event)"
      ></app-cards>

      <!-- Mensaje si no hay resultados -->
      <div *ngIf="filteredCards.length === 0" class="flex flex-col items-center justify-center py-16 text-center">
        <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
        </svg>
        <h3 class="text-xl font-semibold text-gray-700 mb-2">No hay startups disponibles</h3>
        <p class="text-gray-500">Vuelve pronto para descubrir nuevas startups innovadoras.</p>
      </div>
    </ng-container>
  </section>
</main>

<app-footer></app-footer>
