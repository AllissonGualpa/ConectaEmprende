<div class="min-h-screen flex justify-center items-center bg-gray-50 px-4 py-8">
  
  <!-- Loading -->
  <div *ngIf="cargando" class="text-center">
    <mat-spinner diameter="50" class="mx-auto mb-4" color="primary"></mat-spinner>
    <p class="text-sm text-gray-600">Cargando formulario...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error && !cargando" class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 text-center">
    <mat-icon class="text-red-500 text-5xl mb-4">error_outline</mat-icon>
    <h2 class="text-lg font-semibold text-gray-800 mb-2">Error</h2>
    <p class="text-sm text-gray-600">{{ error }}</p>
  </div>

  <!-- Formulario -->
  <div *ngIf="!cargando && !error && formularioData && emprendimiento" 
       class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">

    <!-- ENCABEZADO -->
    <div class="text-center mb-6">
      <h2 class="text-[#ED6C1C] font-semibold text-lg mb-2">
        {{ getTituloFormulario() }}
      </h2>
      <p class="text-sm text-gray-600">
        {{ emprendimiento.nombreComercial }}
      </p>
    </div>

    <!-- EMOJIS DE REFERENCIA (solo para preguntas de escala 1-5) -->
    <div *ngIf="hasEscala5()" class="flex justify-between mb-6 px-2">
      <mat-icon *ngFor="let emoji of emojis" [class]="emoji.color">
        {{ emoji.icon }}
      </mat-icon>
    </div>


    <!-- FORMULARIO REACTIVO -->
    <form [formGroup]="formularioValoracion" (ngSubmit)="enviar()">

      <!-- CADA PREGUNTA -->
      <div *ngFor="let pregunta of formularioData.preguntas; let i = index" 
           class="mb-6">
        
        <!-- Título de la pregunta -->
        <p class="text-sm font-medium mb-3 text-gray-800">
          {{ pregunta.pregunta }}
          <span *ngIf="pregunta.obligatoria" class="text-red-500 ml-1">*</span>
        </p>

        <!-- TIPO: ESCALA -->
        <div *ngIf="pregunta.tipo === 'ESCALA'" 
             class="flex justify-between gap-2">
          <button
            *ngFor="let valor of getRango(pregunta)"
            type="button"
            (click)="seleccionar(pregunta.idPregunta, valor)"
            class="flex-1 h-10 rounded-full flex items-center justify-center transition-all duration-200 font-medium"
            [ngClass]="{
              'bg-[#B8EEFF] text-slate-800 border-2 border-[#B8EEFF]': estaSeleccionado(pregunta.idPregunta, valor),
              'bg-[#B8EEFF]/40 text-slate-600 border-2 border-[#B8EEFF]': !estaSeleccionado(pregunta.idPregunta, valor)
            }">
            {{ valor }}
          </button>
        </div>

        <!-- TIPO: SELECCIÓN MÚLTIPLE -->
        <div *ngIf="pregunta.tipo === 'SELECCION_MULTIPLE' && pregunta.opciones" 
             class="space-y-2">
          <button
            *ngFor="let opcion of pregunta.opciones"
            type="button"
            (click)="seleccionar(pregunta.idPregunta, opcion.valor)"
            class="w-full px-4 py-3 rounded-lg text-left text-sm transition-all duration-200"
            [ngClass]="{
              'bg-[#B8EEFF] text-slate-800 border-2 border-[#B8EEFF]': estaSeleccionado(pregunta.idPregunta, opcion.valor),
              'bg-gray-50 text-gray-700 border-2 border-gray-200 hover:border-[#B8EEFF]': !estaSeleccionado(pregunta.idPregunta, opcion.valor)
            }">
            {{ opcion.textoOpcion }}
          </button>
        </div>

        <!-- TIPO: TEXTO LIBRE -->
        <div *ngIf="pregunta.tipo === 'TEXTO_LIBRE'">
          <textarea
            [formControlName]="'pregunta_' + pregunta.idPregunta"
            rows="4"
            placeholder="Escribe tu respuesta aquí..."
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-[#B8EEFF] focus:outline-none text-sm resize-none"
          ></textarea>
        </div>

        <!-- Error de validación -->
        <p *ngIf="formularioValoracion.get('pregunta_' + pregunta.idPregunta)?.invalid && 
                  formularioValoracion.get('pregunta_' + pregunta.idPregunta)?.touched"
           class="text-xs text-red-500 mt-1">
          Este campo es obligatorio
        </p>
      </div>

      <!-- BOTÓN ENVIAR -->
      <button
        type="submit"
        mat-raised-button
        [disabled]="enviando"
        class="w-full rounded-xl py-3 font-medium transition-all duration-200 mt-4"
        [ngClass]="{
          'bg-[#ED6C1C] text-white hover:bg-[#d45f17]': !enviando,
          'bg-gray-300 text-gray-500 cursor-not-allowed': enviando
        }">
        <span *ngIf="!enviando">Enviar valoración</span>
        <span *ngIf="enviando" class="flex items-center justify-center gap-2">
          <mat-spinner diameter="20" color="accent"></mat-spinner>
          Enviando...
        </span>
      </button>
    </form>

  </div>
</div>
