<!-- BACKDROP -->
<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">

  <!-- MODAL -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl relative p-6 max-h-[90vh] overflow-y-auto">

    <!-- BOTÓN CERRAR -->
    <button
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl"
      (click)="closeModal()">
      ✕
    </button>

    <section *ngIf="isLoading" class="text-center py-12">
      Cargando evento...
    </section>

    <section *ngIf="error && !isLoading" class="text-center text-red-600 py-12">
      {{ error }}
    </section>

    <article *ngIf="event && !isLoading">
      <img *ngIf="event.imagenUrl"
        [src]="event.imagenUrl"
        class="w-full h-64 object-cover rounded mb-4" />

      <h1 class="text-2xl font-bold mb-2">{{ event.titulo }}</h1>

      <div class="text-sm text-gray-600 mb-4">
        <span *ngIf="event.fechaEvento">📅 {{ event.fechaEvento | date:'longDate' }}</span>
        <span *ngIf="event.tipoEvento"> • {{ event.tipoEvento }}</span>
        <span *ngIf="event.lugar"> • {{ event.lugar }}</span>
      </div>

      <p class="mb-4 text-gray-800">{{ event.descripcion }}</p>

      <div *ngIf="event.linkInscripcion">
        <a
          [href]="event.linkInscripcion"
          target="_blank"
          class="inline-block mt-4 px-5 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600">
          Ir al formulario
        </a>
      </div>
    </article>

  </div>
</div>
