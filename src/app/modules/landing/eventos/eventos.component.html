<app-navbar></app-navbar>
<main>
  <section
    class="relative bg-center bg-cover bg-no-repeat"
    style="background-image: url('/assets/img/emprendimiento/foto1.png');"
    aria-label="Sección de bienvenida">

    <!--capa oscura-->
    <div class="absolute inset-0 bg-black/50"></div>

    <!--contenido-->
    <div
      class="relative max-w-7xl mx-auto px-4 sm:px-8 min-h-[520px] md:min-h-[580px] flex flex-col items-center justify-center text-center text-white">

      <!--titulo-->
      <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 font-poppins">
        Eventos
      </h1> <br>

      <!--parrafo-->
      <p class="text-base sm:text-lg md:text-xl text-white/90 font-medium max-w-2xl mx-auto leading-relaxed">
        Descubre los próximos eventos que impulsan el ecosistema emprendedor. <br>
        Conecta, aprende y haz crecer tus ideas junto a otros innovadores. ¡No te los pierdas!
      </p>

      <!-- search bar -->
      <div class="w-full flex justify-center mt-10 px-4 ">
        <div class="w-full max-w-5xl">
          <app-search-bar
            (search)="onSearch($event)"
            [labelQuery]="'Buscar por nombre o tipo'"
            [filters]="[
              { key: 'date', label: 'Fecha' },
              { key: 'type', label: 'Tipo', options: ['Online','Presencial'] }
            ]">
          </app-search-bar>
        </div>
      </div>

    </div>
  </section>
    <!-- tarjetas -->
     <section><br>
  <div class="text-center mb-10">
      <h2 class="font-poppins text-3xl sm:text-4xl font-semibold text-gray-900">
        Proximos Eventos
      </h2>
      <div class="mt-3 w-24 h-1 bg-orange-500 rounded mx-auto"></div>
    </div>
</section>
  <section class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Badge template (fecha) y actions personalizados para eventos -->
    <ng-template #eventBadge let-item>
      <div class="absolute top-3 right-3">
        <div class="bg-blue-600 text-white px-3 py-1 rounded-xl text-sm shadow">
          {{ item.date ? (item.date | date:'d MMM') : '12 Abr' }}
        </div>
      </div>
    </ng-template>

    <ng-template #eventActions let-item>
      <div class="flex flex-col gap-2">
        <button (click)="onRegister(item)" 
        class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg active:scale-95 transition duration-150">Registrarse</button>
        <a (click)="onDiscover(item)" class="text-center text-orange-500 mt-2 cursor-pointer">Ver Detalle</a>
      </div>
    </ng-template>

    <!-- empty overlay to prevent actionTemplate rendering in the image overlay -->
    <ng-template #emptyOverlay></ng-template>

    <app-cards
      [items]="filtered"
      [pageSize]="pageSize"
      [badgeTemplate]="eventBadge"
      [actionTemplate]="eventActions"
      [overlayTemplate]="emptyOverlay"
      (discover)="onDiscover($event)"
      (toggleFavorite)="onToggleFavorite($event)"
      ctaLabel="Registrarse">
    </app-cards>
</section>
</main>

<br>
<app-footer></app-footer>
