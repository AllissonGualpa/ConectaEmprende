<div class="w-full">
  <!-- GRID -->
  <div
    [ngClass]="
      singleColumn
        ? 'grid grid-cols-1 gap-10'
        : 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12'
    "
  >
    <article
      *ngFor="let item of pagedItems"
      class="group flex flex-col mx-auto w-full max-w-[320px]"
      [class.h-full]="fixedHeightCards"
    >
      <!-- IMAGEN -->
      <div class="relative">
        <!-- IMAGEN NORMAL - Usar la imagen que viene del item -->
        <img
          [src]="item.image"
          [alt]="item.title"
          class="w-full h-56 object-cover rounded-2xl"
        />

        <!-- UBICACIÓN -->
        <div
          *ngIf="showLocation"
          class="absolute top-3 left-3 bg-white/90 text-xs text-gray-700 px-3 py-1 rounded-full shadow-sm flex items-center gap-1"
        >
          <svg
            class="w-3.5 h-3.5 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 11c1.657 0 3-1.343 3-3S13.657 5 12 5 9 6.343 9 8s1.343 3 3 3z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 21s-7-4.5-7-11a7 7 0 0114 0c0 6.5-7 11-7 11z"
            />
          </svg>
          {{ item.location || 'Guayaquil' }}
        </div>

        <!-- Badge personalizado si existe -->
        <ng-container
          *ngIf="badgeTemplate"
          [ngTemplateOutlet]="badgeTemplate"
          [ngTemplateOutletContext]="{ $implicit: item }">
        </ng-container>

        <!-- Botón roadmap -->
        <button
          *ngIf="showRoadmapButton"
          (click)="onRoadmap(item)"
          class="absolute top-3 right-3 bg-white/90 hover:bg-orange-400 text-gray-700 text-xs px-4 py-2 rounded-full transition active:scale-95 shadow-md"
        >
          {{ roadmapLabel }}
        </button>

        <!-- Overlay si existe -->
        <ng-container
          *ngIf="overlayTemplate"
          [ngTemplateOutlet]="overlayTemplate"
          [ngTemplateOutletContext]="{ $implicit: item }">
        </ng-container>
      </div>

      <!-- CONTENIDO -->
      <div class="mt-4 flex flex-col flex-1" [class.h-full]="fixedHeightCards">
        <!-- Categoría y estado -->
        <div class="flex items-center gap-2 mb-2 flex-wrap" 
             [class.min-h-[56px]]="fixedHeightCards">
          <span
            class="inline-block px-3 py-1 rounded-full text-xs font-medium"
            style="background-color:#FFF4C8; color:#C0A537"
          >
             {{ item.category || 'Alimentos y Bebidas' }}
          </span>

          <span
            *ngIf="showStatus && item.status"
            class="inline-block px-3 py-1 rounded-full text-xs font-medium"
            [ngClass]="{
              'bg-green-100 text-green-700': item.status === 'Aprobado' || item.status === 'En revisión',
              'bg-red-100 text-red-700': item.status === 'Rechazado' || item.status === 'Borrador'
            }">
            {{ item.status }}
          </span>
        </div>

        <!-- Título -->
        <h3 class="text-lg font-semibold text-gray-900 mb-2"
            [class.min-h-[50px]]="fixedHeightCards"
            [class.line-clamp-2]="fixedHeightCards">
          {{ item.title }}
        </h3>

        <!-- Descripción -->
        <p class="text-sm text-gray-600 leading-relaxed mb-4"
           [class.line-clamp-3]="fixedHeightCards"
           [class.min-h-[63px]]="fixedHeightCards"
           [class.flex-grow]="fixedHeightCards">
          {{
            item.description ||
              'Descubre los próximos eventos que impulsan el ecosistema emprendedor.'
          }}
        </p>

        <!-- BOTONES: Si existe actionTemplate usarlo, sino usar el botón por defecto -->
        <ng-container *ngIf="actionTemplate; else defaultButton">
          <div [class.mt-auto]="fixedHeightCards">
            <ng-container
              [ngTemplateOutlet]="actionTemplate"
              [ngTemplateOutletContext]="{ $implicit: item }">
            </ng-container>
          </div>
        </ng-container>

        <ng-template #defaultButton>
          <!-- Botón por defecto -->
          <button
            (click)="!isEditDisabled(item) && onDiscover(item)"
            [disabled]="isEditDisabled(item)"
            [title]="isEditDisabled(item) ? 'No puedes editar un emprendimiento en revisión o rechazado.' : ''"
            class="w-full py-2 rounded-lg transition
                  bg-orange-500 hover:bg-orange-600 text-white
                  disabled:bg-gray-300 disabled:text-gray-500
                  disabled:cursor-not-allowed disabled:hover:bg-gray-300"
            [class.mt-auto]="fixedHeightCards">
            {{ ctaLabel }}
          </button>
        </ng-template>

        <!-- Footer personalizado si existe -->
        <ng-container
          *ngIf="footerTemplate"
          [ngTemplateOutlet]="footerTemplate"
          [ngTemplateOutletContext]="{ $implicit: item }">
        </ng-container>
      </div>
    </article>
  </div>

  <!-- PAGINACION -->
  <div class="mt-12 flex items-center justify-center gap-3">
    <button
      (click)="goTo(currentPage - 1)"
      [disabled]="currentPage === 1"
      class="px-3 py-1 rounded border text-sm disabled:opacity-40"
    >
      Regresar
    </button>

    <ng-container *ngFor="let p of [].constructor(totalPages); let i = index">
      <button
        (click)="goTo(i + 1)"
        class="w-8 h-8 rounded-full border text-sm"
        [class.bg-orange-500]="currentPage === i + 1"
        [class.text-white]="currentPage === i + 1"
      >
        {{ i + 1 }}
      </button>
    </ng-container>

    <button
      (click)="goTo(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      class="px-3 py-1 rounded border text-sm disabled:opacity-40"
    >
      Siguiente
    </button>
  </div>
</div>
