<!-- Emprendimiento -->
<div class="md:col-span-1 w-full">
  <label class="block text-xs text-gray-600 mb-1">
    {{ label }}
  </label>

  <mat-form-field appearance="outline" class="w-full">
    <mat-select
      [formControl]="emprendimientoControl"
      [placeholder]="placeholder"
      [required]="required"
      [disabled]="disabled"
      (selectionChange)="onEmprendimientoSelected($event.value)"
    >

      <!-- Cargando -->
      <mat-option *ngIf="isLoading" disabled>
        <div class="flex items-center gap-2 py-2">
          <mat-spinner diameter="18"></mat-spinner>
          <span class="text-xs text-gray-600">Cargando emprendimientos...</span>
        </div>
      </mat-option>

      <!-- Lista -->
      <mat-option
        *ngFor="let emprendimiento of filteredEmprendimientos"
        [value]="emprendimiento.id"
      >
        {{ emprendimiento.nombreComercial }}
      </mat-option>

      <!-- Sin resultados -->
      <mat-option
        *ngIf="!isLoading && filteredEmprendimientos.length === 0 && searchText"
        disabled
      >
        No se encontraron resultados
      </mat-option>

      <!-- Sin datos -->
      <mat-option
        *ngIf="!isLoading && emprendimientos.length === 0 && !searchText"
        disabled
      >
        No hay emprendimientos disponibles
      </mat-option>

    </mat-select>

    <!-- Botón limpiar -->
    <button
      *ngIf="emprendimientoControl.value && !disabled"
      matSuffix
      mat-icon-button
      type="button"
      (click)="clearSelection(); $event.stopPropagation()"
    >
      <mat-icon>close</mat-icon>
    </button>

    <mat-error *ngIf="error">
      {{ error }}
    </mat-error>

    <mat-error *ngIf="emprendimientoControl.hasError('required')">
      Debe seleccionar un emprendimiento
    </mat-error>
  </mat-form-field>
</div>
