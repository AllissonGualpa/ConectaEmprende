<div>
  <label class="block text-sm font-medium text-gray-700 mb-2">
    Género <span class="text-red-500">*</span>
  </label>
  <div class="flex gap-3">
    <label class="flex-1 p-3 border rounded-lg cursor-pointer text-center"
           [ngClass]="{'bg-orange-500 text-white border-orange-500': value === 'masculino'}"
           (click)="selectGender('masculino')">
      Masculino
    </label>
    <label class="flex-1 p-3 border rounded-lg cursor-pointer text-center"
           [ngClass]="{'bg-orange-500 text-white border-orange-500': value === 'femenino'}"
           (click)="selectGender('femenino')">
      Femenino
    </label>
    <label class="flex-1 p-3 border rounded-lg cursor-pointer text-center"
           [ngClass]="{'bg-orange-500 text-white border-orange-500': value === 'otro'}"
           (click)="selectGender('otro')">
      Otro
    </label>
  </div>
  <div *ngIf="showError" class="text-red-500 text-sm mt-1">
    {{ errorMessage }}
  </div>
</div>
