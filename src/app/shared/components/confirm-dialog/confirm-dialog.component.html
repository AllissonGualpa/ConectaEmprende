<h2 mat-dialog-title class="text-xl font-semibold text-gray-800">
  Confirmación
</h2>

<mat-dialog-content class="py-6">
  <p class="text-gray-600">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions class="flex justify-end gap-2 p-4">
  <button 
    mat-button 
    (click)="onCancel()"
    class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md">
    No
  </button>
  <button 
    mat-raised-button 
    color="primary"
    (click)="onConfirm()"
    class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-md">
    Sí
  </button>
</mat-dialog-actions>
