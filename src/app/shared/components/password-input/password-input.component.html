<div>
  <label [for]="id" class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }} <span class="text-red-500">*</span>
  </label>
  <div class="relative">
    <input 
      [type]="showPassword ? 'text' : 'password'" 
      [id]="id" 
      [value]="value"
      [disabled]="disabled"
      (input)="onInputChange($event)"
      (blur)="onTouched()"
      class="block w-full p-3 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
      [placeholder]="placeholder">
    
    <button type="button" (click)="togglePassword()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 flex items-center">
      <!-- Ojo normal -->
      <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 
          9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
      <!-- Ojo tachado -->
      <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 
          0-8.268-2.943-9.542-7a9.953 9.953 
          0 012.873-4.518M9.88 9.88a3 3 0 
          104.24 4.24" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 3l18 18" />
      </svg>
    </button>
  </div>
  <div *ngIf="showError" class="text-red-500 text-sm mt-1">
    {{ errorMessage }}
  </div>
</div>
