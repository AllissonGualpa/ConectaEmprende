<!-- card-event.component.html -->
<div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col md:flex-row mb-6">  
  <!-- Imagen con fecha -->
  <div class="relative w-full md:w-48 h-48 md:h-auto flex-shrink-0">
    <img 
      [src]="evento.urlMultimedia" 
      [alt]="evento.titulo"
      class="w-full h-full object-cover"
      onerror="this.src='/assets/img/emprendimiento/foto1.png'">
    
    <!-- Badge de fecha -->
    <div class="absolute top-4 left-4 bg-blue-600 text-white rounded-lg px-3 py-2 text-center shadow-lg">
      <div class="text-2xl font-bold leading-none">{{ formatearFecha(evento.fechaEvento).dia }}</div>
      <div class="text-xs font-medium uppercase">{{ formatearFecha(evento.fechaEvento).mes }}</div>
    </div>
  </div>

  <!-- Contenido -->
  <div class="flex-1 p-6 flex flex-col justify-between">
    
    <!-- Información del evento -->
    <div>
      <h3 class="text-xl font-bold text-gray-800 mb-2">{{ evento.titulo }}</h3>
      <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ evento.descripcion }}</p>
      
      <!-- Detalles -->
      <div class="space-y-2 mb-4">
        <div *ngIf="evento.fechaEvento" class="flex items-center text-sm text-gray-600">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>Fecha: {{ evento.fechaEvento }}</span>
        </div>
        
        <div *ngIf="evento.lugar" class="flex items-center text-sm text-gray-600">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>Lugar: {{ evento.lugar }}</span>
        </div>
        
        <div class="flex items-center text-sm text-gray-600">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span>Modalidad: {{ evento.tipoEvento }}</span>
        </div>
        
        <div class="flex items-center text-sm">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
          </svg>
          <span class="px-3 py-1 rounded-full text-xs font-medium uppercase" [ngClass]="estadoClass">
            {{ evento.estadoEvento }}
          </span>
        </div>
      </div>
    </div>

    <!-- Acciones -->
    <div *ngIf="showActions" class="flex items-center gap-3 mt-4">
      <button 
        (click)="onCancelar()" 
        [disabled]="isEventoCancelado"
        [class.opacity-50]="isEventoCancelado"
        [class.cursor-not-allowed]="isEventoCancelado"
        class="flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors disabled:hover:bg-blue-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        Cancelar Evento
      </button>
      
      <button 
        (click)="onEditar()" 
        [disabled]="isEventoCancelado"
        [class.opacity-50]="isEventoCancelado"
        [class.cursor-not-allowed]="isEventoCancelado"
        class="flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg transition-colors disabled:hover:bg-orange-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
        Editar Evento
      </button>
    </div>

  </div>
</div>
