<div class="relative p-4">
  <!-- Botón cerrar encima del modal -->
  <button
    type="button"
    (click)="close()"
    aria-label="Cerrar"
    class="absolute right-3 top-3 text-gray-600 hover:text-gray-900 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow"
  >
    ✕
  </button>

  <!-- Componente de edición (modo solo lectura). Se propaga (close) del hijo al wrapper -->
  <div class="pt-6">
    <app-edit-solicitud-emprendimiento
      [emprendimientoId]="data?.emprendimientoId ?? 0"
      [soloLectura]="data?.soloLectura ?? false"
      (close)="onChildClose()"
    ></app-edit-solicitud-emprendimiento>
  </div>
</div>
