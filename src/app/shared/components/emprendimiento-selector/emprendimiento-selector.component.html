<div class="w-full">
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>{{ label }}</mat-label>
    
    <mat-select
      [formControl]="emprendimientoControl"
      [placeholder]="placeholder"
      [required]="required"
      [disabled]="disabled"
      (selectionChange)="onEmprendimientoSelected($event.value)"
    >


      <!-- Estado de carga -->
      <mat-option *ngIf="isLoading" disabled>
        <div class="flex items-center gap-2 justify-center py-2">
          <mat-spinner diameter="20"></mat-spinner>
          <span class="text-sm text-gray-600">Cargando emprendimientos...</span>
        </div>
      </mat-option>

      <!-- Lista de emprendimientos -->
      <mat-option
        *ngFor="let emprendimiento of filteredEmprendimientos"
        [value]="emprendimiento.id"
      >
        <div class="flex items-center gap-2">
          <mat-icon class="text-gray-500">store</mat-icon>
          <span>{{ emprendimiento.nombreComercial }}</span>
        </div>
      </mat-option>

      <!-- Sin resultados -->
      <mat-option
        *ngIf="!isLoading && filteredEmprendimientos.length === 0 && searchText"
        disabled
      >
        <div class="text-center py-2 text-gray-500">
          <mat-icon class="text-gray-400">search_off</mat-icon>
          <p class="text-sm mt-1">No se encontraron resultados</p>
        </div>
      </mat-option>

      <!-- Sin emprendimientos -->
      <mat-option
        *ngIf="!isLoading && emprendimientos.length === 0 && !searchText"
        disabled
      >
        <div class="text-center py-2 text-gray-500">
          <mat-icon class="text-gray-400">store</mat-icon>
          <p class="text-sm mt-1">No hay emprendimientos disponibles</p>
        </div>
      </mat-option>
    </mat-select>

    <mat-icon matPrefix class="text-gray-500">business</mat-icon>
    
    <button
      *ngIf="emprendimientoControl.value && !disabled"
      matSuffix
      mat-icon-button
      aria-label="Limpiar selección"
      (click)="clearSelection(); $event.stopPropagation()"
      type="button"
      class="mr-2"
    >
      <mat-icon>close</mat-icon>
    </button>

    <mat-error *ngIf="error">{{ error }}</mat-error>
    <mat-error *ngIf="emprendimientoControl.hasError('required')">
      Debe seleccionar un emprendimiento
    </mat-error>
    
    <mat-hint *ngIf="!error && !isLoading && emprendimientos.length > 0">
      {{ emprendimientos.length }} emprendimiento(s) disponible(s)
    </mat-hint>
  </mat-form-field>
</div>
