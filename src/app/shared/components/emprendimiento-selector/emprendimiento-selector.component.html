<div class="w-full">
  <label class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }}
    <span *ngIf="required" class="text-red-500 ml-1">*</span>
  </label>

  <mat-form-field appearance="outline" class="w-full">
    <mat-select
      [formControl]="emprendimientoControl"
      [placeholder]="placeholder"
      [required]="required"
      [disabled]="disabled || isLoading"
      (selectionChange)="onEmprendimientoSelected($event.value)"
    >
      <!-- Opciones de emprendimientos -->
      <mat-option 
        *ngFor="let emprendimiento of filteredEmprendimientos; trackBy: trackByFn" 
        [value]="emprendimiento.id"
      >
        {{ emprendimiento.nombreComercialEmprendimiento }}
      </mat-option>

      <!-- Mensaje cuando está cargando -->
      <mat-option *ngIf="isLoading" disabled>
        <div class="flex items-center gap-2 py-2">
          <mat-spinner diameter="16"></mat-spinner>
          <span class="text-sm text-gray-500">Cargando...</span>
        </div>
      </mat-option>

      <!-- Mensaje cuando no hay emprendimientos -->
      <mat-option *ngIf="!isLoading && filteredEmprendimientos.length === 0" disabled>
        <span class="text-sm text-gray-500">No hay emprendimientos disponibles</span>
      </mat-option>
    </mat-select>

    <!-- Botón para limpiar selección -->
    <button
      *ngIf="emprendimientoControl.value && !disabled && !isLoading"
      matSuffix
      mat-icon-button
      type="button"
      (click)="clearSelection(); $event.stopPropagation()"
    >
      <mat-icon>close</mat-icon>
    </button>

    <!-- Mensajes de error -->
    <mat-error *ngIf="error">{{ error }}</mat-error>
    <mat-error *ngIf="emprendimientoControl.hasError('required') && !error">
      Debe seleccionar un emprendimiento
    </mat-error>
  </mat-form-field>
</div>
