<div class="flex justify-center items-center min-h-screen p-8 gap-16 max-w-screen-lg mx-auto">
  <div class="flex-0 w-full max-w-md">
    <!-- Título centrado -->
    <h1 class="text-2xl font-bold mb-2 text-black text-center font-tt">
      Bienvenido
    </h1>
    <p class="text-sm text-gray-600 mb-6 text-center font-italic">
      Hoy es tu día para emprender. Tú decides el rumbo.
      Inicia sesión para conectar con el ecosistema
    </p>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-4">
      <!-- Correo -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Introduce tu correo electrónico"
          required
          class="block w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password"
          placeholder="Introduce tu contraseña" required
          class="block w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <!-- Olvidaste tu contraseña -->
      <div class="flex justify-end">
        <a href="#" class="text-sm text-blue-500 hover:underline">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón login -->
      <button type="submit"
        class="w-full py-3 bg-orange-500 text-white rounded-lg font-medium text-sm hover:bg-orange-600 transition-colors">
        Iniciar Sesión
      </button>

      <!-- Separador -->
      <div class="text-center my-6 text-sm text-gray-400">---------------------------------------o---------------------------------------</div>

      <!-- Login con Google -->
      <button type="button"
        class="w-full py-3 border border-gray-300 rounded-lg text-sm flex items-center justify-center gap-2 hover:bg-gray-100 transition-colors">
        <img src="./assets/img/google.png" alt="Google" class="w-5 h-5">
        Iniciar sesión con Google
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      ¿Todavía no tienes una cuenta?
      <a routerLink="/register" class="text-blue-500 hover:underline">Regístrate</a>
    </p>
  </div>

  <!-- Imagen -->
  <div class="flex-0 w-full max-w-lg flex justify-center">
    <img src="./assets/img/fotoLogin.jpg" alt="Equipo de trabajo" class="w-4/5 h-auto rounded-xl shadow-lg">
  </div>
</div>
